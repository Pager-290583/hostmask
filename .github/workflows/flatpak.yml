# Builds the Flatpak bundle on every push to main and publishes it as a release.
# - push to main: updates the rolling pre-release "latest" (hostmask.flatpak).
# - tag v*: creates a permanent release with the same file.
name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hostmask.flatpak
          manifest-path: flatpak/io.github.hostmask.Hostmask.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'flatpak/*.yml') }}
          arch: x86_64

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: hostmask-x86_64.flatpak
      - name: Locate bundle
        run: f=$(find . -name "*.flatpak" | head -1) && [ "$f" != ./hostmask.flatpak ] && mv "$f" hostmask.flatpak; ls -l hostmask.flatpak
      - name: Update rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hostmask.flatpak \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(echo $GITHUB_SHA | cut -c1-7))" \
            --notes "Автосборка из main, коммит $GITHUB_SHA. Установка: flatpak install --user hostmask.flatpak"
      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" hostmask.flatpak \
            --title "Hostmask $GITHUB_REF_NAME" --generate-notes
